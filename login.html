<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software CocaCola - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body-wrapper">

    <div class="login-split-container">
        <!-- SECCIÓN IZQUIERDA: ROJA / COCA-COLA -->
        <div class="login-left-panel">
            <h1 class="brand-title">Software CocaCola</h1>
            
            <div class="formula-art">
                <span class="math-sym plus">+</span>
                <span class="math-sym minus">-</span>
                <span class="math-sym sigma">Σ</span>
                <span class="math-sym pi">π</span>
            </div>

            <!-- ILUSTRACIÓN BOTELLA -->
            <div class="bottle-wrapper">
                <div class="bottle-cap"></div>
                <div class="bottle-neck"></div>
                <div class="bottle-body">
                    <span class="bottle-label">Coca-Cola</span>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: FORMULARIO -->
        <div class="login-right-panel">
            <h2 class="welcome-heading">¡Bienvenido de nuevo!</h2>

            <form id="loginForm" onsubmit="validarLogin(event)" class="form-container">
                <div class="custom-input-box">
                    <input type="text" id="usuario" placeholder="usuario" required autocomplete="off">
                </div>

                <div class="custom-input-box password-box">
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <span class="eye-icon" onclick="togglePassword()">👁️</span>
                </div>

                <button type="submit" class="btn-login-gradient">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        const usuariosValidos = {
            'Mariana': 'mariana2026',
            'Luis': 'luis2026',
            'Sebas': 'sebas2026',
            'Rudy': 'rudy2026',
            'Axel': 'axel2026',
            'Nohemi': 'nohemi2026',
            'Angie': 'angie2026'
        };

        function validarLogin(e) {
            e.preventDefault();
            const u = document.getElementById('usuario').value.trim();
            const p = document.getElementById('password').value.trim();

            if (usuariosValidos[u] && usuariosValidos[u] === p) {
                window.location.href = 'index.html';
            } else {
                alert('Usuario o contraseña incorrectos.');
            }
        }
    </script>
</body>
</html>
